[project]
name = "meeting-agent"
version = "0.1.0"
description = "Universal Meeting Recorder & AI Summarizer for Zoom, Moodle, and Microsoft Teams"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=24.1.0",
    "cryptography>=50.0.1",
    "fastapi>=0.115.0",
    "faster-whisper>=1.0.0",
    "google-api-python-client>=2.200.0",
    "google-auth-httplib2>=0.4.2",
    "google-auth-oauthlib>=1.4.1",
    "google-genai>=1.0.0",
    "icalendar>=7.3.0",
    "imageio-ffmpeg>=0.5.1",
    "numpy>=1.26.0",
    "openai>=1.50.0",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.1.18",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.15.0",
    "python-dateutil>=2.9.0.post0",
    "python-multipart>=0.0.12",
    "recurring-ical-events>=3.8.2",
    "requests>=2.31.0",
    "sqlalchemy>=2.1.1",
    "pypdf>=5.0.0",
    "python-pptx>=1.0.2",
    "uvicorn>=0.30.0",
    "langchain>=1.4.3",
    "langgraph>=1.2.12",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.7",
    "apscheduler>=3.10.4",
    "httpx>=0.27.0",
    "bcrypt>=4.2.0",
    "pyjwt>=2.9.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
]
ignore = [
    "B008",   # Do not perform function call `Depends`, `Query`, etc. in argument defaults (standard FastAPI pattern)
    "E501",   # Line too long (handled by formatter or intentional long prompt templates)
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.Query",
    "fastapi.params.Query",
    "fastapi.Body",
    "fastapi.params.Body",
    "fastapi.File",
    "fastapi.params.File",
    "fastapi.Form",
    "fastapi.params.Form",
    "fastapi.Header",
    "fastapi.params.Header",
    "fastapi.Path",
    "fastapi.params.Path",
    "fastapi.Security",
    "fastapi.params.Security",
]
