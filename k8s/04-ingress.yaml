apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: upload-limit
  namespace: dhbw-viber
spec:
  buffering:
    maxRequestBodyBytes: 524288000  # 500MB limit for recordings and PDF uploads
    memRequestBodyBytes: 2097152    # 2MB memory buffer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meeting-agent-ingress
  namespace: dhbw-viber
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: dhbw-viber-upload-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - dhbw-viber.atai.site
    secretName: dhbw-viber-tls-secret
  rules:
  - host: dhbw-viber.atai.site
    http:
      paths:
      # API and backend endpoints
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      - path: /recordings
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      - path: /health
        pathType: Exact
        backend:
          service:
            name: backend
            port:
              number: 8000
      # Frontend React SPA
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
