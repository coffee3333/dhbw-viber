apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-data-pvc
  namespace: dhbw-viber
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: dhbw-viber
data:
  APP_NAME: "MeetingAgent AI - DHBW Student Manager"
  APP_VERSION: "0.2.0"
  DEBUG: "false"
  HOST: "0.0.0.0"
  PORT: "8000"
  ALLOWED_ORIGINS: "https://dhbw-viber.atai.site,http://localhost:5173"
  TRANSCRIPTION_ENGINE: "gemini"
  SUMMARIZATION_ENGINE: "gemini"
  GEMINI_MODEL: "gemini-2.0-flash"
  OPENAI_MODEL: "gpt-4o"
  WHISPER_LOCAL_MODEL: "base"
  AUDIO_LANGUAGE: "auto"
  SUMMARY_DETAIL: "standard"
  GOOGLE_AUTO_SYNC_CALENDAR: "false"
  GOOGLE_AUTO_SYNC_TASKS: "true"
  GOOGLE_AUTO_SYNC_DRIVE: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: dhbw-viber
type: Opaque
stringData:
  SECRET_KEY: "generate-a-strong-random-key-for-production"
  APP_PASSWORD: ""
  GEMINI_API_KEY: ""
  OPENAI_API_KEY: ""
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  GOOGLE_REDIRECT_URI: "https://dhbw-viber.atai.site/api/v1/google/oauth2callback"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dhbw-viber
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: backend
        image: ghcr.io/coffee3333/meeting-agent-backend:latest
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 8000
        envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: backend-secret
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_DB
        - name: DATABASE_URL
          value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
        resources:
          limits:
            memory: "1536Mi"
            cpu: "1000m"
          requests:
            memory: "512Mi"
            cpu: "250m"
        volumeMounts:
        - name: data
          mountPath: /app/data
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 15
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: backend-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: dhbw-viber
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000
    name: http
